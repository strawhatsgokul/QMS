name: CI

on:
  push:
    branches: [Developement]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Unit Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run API tests
        run: npm run test:api

      - name: Build agent executable
        run: pwsh -File build-exe.ps1
        working-directory: packages/qms-agent

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: qms-agent
          path: packages/qms-agent/qms-agent.exe
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E Tests
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start servers and run E2E tests
        run: |
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "nx run api:dev" -PassThru
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "nx run web:dev" -PassThru
          Start-Sleep -Seconds 15
          npm run test:e2e
